[project]
name = "tarea-1"
version = "0.1.0"
description = "Ejercicio de Pipeline para bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "ruff>=0.16.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.ruff]
line-length = 88                      # Ancho preferido de las lineas
target-version = "py311"              # version minima del proyecto
exclude = [                           # evita analizar estos
    ".venv", "data", "build",
    "dist", "docs", "reports",
    ]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"] # comprobaciones básicas de estilo, sintaxis, logica e imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"